name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Fresence.slnx

      - name: Build
        run: dotnet build Fresence.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test Fresence.slnx --no-build --configuration Release
